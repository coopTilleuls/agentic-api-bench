services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: llmapi
      POSTGRES_PASSWORD: llmapi
      POSTGRES_DB: llmapi
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmapi -d llmapi"]
      interval: 1s
      timeout: 3s
      retries: 30
