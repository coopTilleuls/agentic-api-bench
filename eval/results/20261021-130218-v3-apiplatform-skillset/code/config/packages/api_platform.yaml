api_platform:
    title: Bookshop API
    version: 1.0.0
    formats:
        jsonapi: ['application/vnd.api+json']
    jsonapi:
        use_iri_as_id: false
    defaults:
        stateless: true
        pagination_items_per_page: 10
        normalization_context:
            skip_null_values: false
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin', 'Customer-Id']
