api_platform:
    title: Bookshop API
    version: 1.0.0
    formats:
        jsonapi: ['application/vnd.api+json']
    error_formats:
        jsonapi: ['application/vnd.api+json']
    docs_formats:
        jsonopenapi: ['application/json', 'application/vnd.openapi+json']
    defaults:
        stateless: true
        normalization_context:
            skip_null_values: false
            datetime_format: 'Y-m-d'
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
    collection:
        pagination:
            page_parameter_name: number
            items_per_page_parameter_name: size
    jsonapi:
        strict_member_names: true
