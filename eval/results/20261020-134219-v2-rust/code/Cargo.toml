[package]
name = "bookshop"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
chrono = "0.4.45"
deadpool-postgres = "0.14.2"
form_urlencoded = "1.2.2"
postgres-types = { version = "0.2.14", features = ["derive"] }
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["full"] }
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4"] }
