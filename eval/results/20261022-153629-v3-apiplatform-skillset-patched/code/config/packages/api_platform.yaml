api_platform:
    title: Bookshop API
    version: 1.0.0
    formats:
        jsonapi: ['application/vnd.api+json']
    defaults:
        stateless: true
        pagination_items_per_page: 10
        pagination_client_items_per_page: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin', 'Customer-Id']
    collection:
        pagination:
            page_parameter_name: number
            items_per_page_parameter_name: size
    jsonapi:
        strict_member_names: true
