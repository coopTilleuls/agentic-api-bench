api_platform:
    title: Bookshop API
    version: 1.0.0
    formats:
        jsonapi: ['application/vnd.api+json']
    defaults:
        stateless: true
        pagination_items_per_page: 10
        pagination_client_items_per_page: true
        pagination_maximum_items_per_page: 50
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
    jsonapi:
        use_iri_as_id: false
        strict_member_names: true
